name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for pycddlib
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libcdd-dev

      - name: Install pycvxset from source (editable)
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/merlresearch/pycvxset.git "$RUNNER_TEMP/pycvxset"
          pip install -e "$RUNNER_TEMP/pycvxset"

      - name: Install PolyPY-MPC and runtime dependencies
        run: |
          pip install numpy scipy casadi cvxpy scs osqp pycddlib matplotlib pandas
          # pycvxset is already installed (editable); do not let it be re-resolved.
          pip install -e . --no-deps

      - name: Import check
        run: python -c "import polypympc; print(polypympc.__version__, polypympc.__all__)"

      - name: Run example scripts
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: |
          python examples/rmpc_example.py
          python examples/rampc_example.py
          python examples/contractive_example.py
