name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for pycddlib / pycvxset
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libcdd-dev

      - name: Install RAMPC
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[viz]"

      - name: Import check
        run: python -c "import rampc; print(rampc.__version__, rampc.__all__)"

      - name: Run example scripts
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: |
          python examples/rmpc_example.py
          python examples/rampc_example.py
          python examples/contractive_example.py
