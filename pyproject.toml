[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rampc"
dynamic = ["version"]
description = "Robust and Adaptive Model Predictive Control tools with recursive-feasibility and constraint-satisfaction guarantees, based on CasADi and convex optimization."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{ name = "Fabio Faliero", email = "fabio.faliero@polito.it" },
	{ name = "Baptiste Braun-Delvoye", email = "baptiste.braun_delvoye@etu.sorbonne_universite.fr" },
]
maintainers = [
	{ name = "Fabio Faliero", email = "fabio.faliero@polito.it" },
]
keywords = [
	"mpc",
	"model predictive control",
	"adaptive control",
	"robust control",
	"optimal control",
	"lpv",
	"tube mpc",
	"casadi",
	"optimization",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Operating System :: OS Independent",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
	"numpy>=1.20",
	"scipy>=1.5.0",
	"casadi>=3.5.5",
	"cvxpy>=1.2.0",
	"scs>=3.0.0",
	"osqp",
	"pycddlib",
	"pycvxset @ git+https://github.com/merlresearch/pycvxset.git",
]

[project.optional-dependencies]
viz = [
	"matplotlib",
	"pandas",
]
notebook = [
	"ipykernel",
]
mosek = [
	"mosek",
]
docs = [
	"sphinx>=7.2",
	"furo",
	"myst-parser",
	"sphinx-gallery",
	"matplotlib",
]
dev = [
	"pytest",
	"black",
	"ruff",
]

[project.urls]
Homepage = "https://falier0s.github.io/RAMPC/"
Documentation = "https://falier0s.github.io/RAMPC/"
Repository = "https://github.com/Falier0s/RAMPC"
Issues = "https://github.com/Falier0s/RAMPC/issues"

[tool.setuptools]
packages = ["rampc", "rampc.tools"]

[tool.setuptools.dynamic]
version = { attr = "rampc.__version__" }

[tool.setuptools.package-dir]
rampc = "src"
"rampc.tools" = "src/tools"

[tool.ruff]
line-length = 100
target-version = "py39"
